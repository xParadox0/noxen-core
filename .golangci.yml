version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    rules:
      # Tests build and run binaries and write fixtures into t.TempDir().
      - path: _test\.go
        linters:
          - gosec
      # Repository tools read files under a root chosen by the caller.
      - path: ^tools/
        linters:
          - gosec
        text: G304

formatters:
  enable:
    - gofmt
    - goimports
